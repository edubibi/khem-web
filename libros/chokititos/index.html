<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOKITITOS | KHEM</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            color: white;
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cover-wrapper {
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        .cover-img {
            max-width: 400px;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            margin: 1rem 0;
            letter-spacing: 4px;
            color: #d4af37;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .tagline {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .amazon-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: black;
            text-decoration: none;
            padding: 1.2rem 3rem;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 2px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: none;
            cursor: pointer;
        }

        .amazon-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        .back-link {
            margin-top: 4rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #d4af37;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .cover-img { max-width: 280px; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="cover-wrapper">
            <!-- Usamos la imagen del tintero que es la que identifica al libro en la web -->
            <img src="../../assets/items/item_libro.jpg" alt="Chokititos Cover" class="cover-img">
        </div>

        <h1>CHOKITITOS</h1>
        <p class="tagline">Un regalo intemporal</p>

        <a href="https://www.amazon.es/dp/B0GHZS9LFY" target="_blank" class="amazon-btn">
            ADQUIRIR EN AMAZON (EBOOK)
        </a>

        <br>
        <a href="../../index.html#literatura" class="back-link">← Volver a Proyectos</a>
    </div>

</body>

</html>
